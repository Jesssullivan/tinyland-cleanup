name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Version consistency
        run: |
          v="$(cat VERSION)"
          mg="$(grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' MODULE.bazel | head -1 | tr -d '"')"
          gv="$(grep -oE 'version = "[0-9]+\.[0-9]+\.[0-9]+"' main.go | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          echo "VERSION=$v  MODULE.bazel=$mg  main.go=$gv"
          if [ "$v" != "$mg" ] || [ "$v" != "$gv" ]; then
            echo "::error::version mismatch — keep VERSION, MODULE.bazel, and main.go in sync"
            exit 1
          fi
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
        env:
          GOFLAGS: -mod=vendor
      - name: Test
        run: go test ./...
        env:
          GOFLAGS: -mod=vendor
      - name: Vet
        run: go vet ./...
        env:
          GOFLAGS: -mod=vendor

  bazel:
    name: Bazel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Test
        run: nix shell nixpkgs#bazelisk --command bazelisk --output_user_root=/tmp/tinyland-cleanup-bazel test //...

  nix:
    name: Nix package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Flake metadata
        run: nix flake check --no-build
      - name: Build package
        run: nix build .#default --no-link --print-build-logs
