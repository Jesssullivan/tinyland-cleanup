name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  go:
    name: Go
    runs-on: tinyland-nix
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Version consistency
        run: |
          v="$(cat VERSION)"
          mg="$(grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' MODULE.bazel | head -1 | tr -d '"')"
          gv="$(grep -oE 'version = "[0-9]+\.[0-9]+\.[0-9]+"' main.go | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          echo "VERSION=$v  MODULE.bazel=$mg  main.go=$gv"
          if [ "$v" != "$mg" ] || [ "$v" != "$gv" ]; then
            echo "::error::version mismatch — keep VERSION, MODULE.bazel, and main.go in sync"
            exit 1
          fi
      - name: Build
        run: nix develop --command go build ./...
      - name: Test
        run: nix develop --command go test ./...
      - name: Vet
        run: nix develop --command go vet ./...

  bazel:
    name: Bazel
    runs-on: tinyland-nix
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Test
        env:
          BAZEL_OUTPUT_USER_ROOT: /tmp/tinyland-cleanup-bazel
        run: nix develop --command just flywheel-test //...

  nix:
    name: Nix package
    runs-on: tinyland-nix
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Flake metadata
        run: nix flake check --no-build
      - name: Build package
        run: nix build .#default --no-link --print-build-logs
